<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin | EducInfo{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a'
                        },
                        obsidian: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
                            400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
                            800: '#1e293b', 900: '#0f172a', 950: '#020617'
                        },
                        vibrant: {
                            amber: '#f59e0b', terracotta: '#ea580c', sage: '#65a30d',
                            ocean: '#0891b2', plum: '#9333ea', rose: '#e11d48'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        /* Solid Obsidian Theme Overrides */
        body {
            background-color: #0a0a0a;
            /* neutral-950 */
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #171717;
            /* neutral-900 */
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            /* neutral-700 */
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #525252;
            /* neutral-600 */
        }

        .sidebar-item-active {
            background-color: #262626;
            /* neutral-800 */
            color: #ffffff;
            border-right: 3px solid #f59e0b;
            /* amber-500 */
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-neutral-950 text-neutral-200 font-sans selection:bg-amber-500/30">
    <div class="flex min-h-screen overflow-hidden">
        <!-- Sidebar -->
        <div id="sidebar-overlay"
            class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden backdrop-blur-sm cursor-pointer"></div>

        {% include 'admin/partials/_sidebar.html' %}

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">

            {% include 'admin/partials/_header.html' %}

            <!-- Scrollable Area -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-10 relative scroll-smooth space-y-8" id="main-scroll-area">
                {% include 'includes/flash_messages.html' %}
                {% block content %}{% endblock %}

                <!-- Footer Spacer -->
                <div class="h-20"></div>
            </div>
        </main>
    </div>

    <!-- Modals Holder -->
    <div id="modal-container"></div>

    <script>
        // Simple smoothing for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);

                if (targetElement) {
                    // Update Active State
                    document.querySelectorAll('nav a').forEach(a => {
                        a.classList.remove('sidebar-item-active');
                        a.classList.remove('text-white'); // Ensure text resets
                        a.classList.add('text-neutral-400');
                    });

                    this.classList.add('sidebar-item-active');
                    this.classList.remove('text-neutral-400');

                    // Breadcrumb
                    const breadcrumb = document.getElementById('breadcrumb-current');
                    if (breadcrumb) {
                        breadcrumb.textContent = this.querySelector('span').textContent;
                    }

                    targetElement.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Current section detection on scroll
        const scrollArea = document.getElementById('main-scroll-area');
        const sections = document.querySelectorAll('section[id]');

        if (scrollArea) {
            scrollArea.addEventListener('scroll', () => {
                let current = "";
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    // const sectionHeight = section.clientHeight;
                    // Ajustement offset pour la détection
                    if (scrollArea.scrollTop >= (sectionTop - 200)) {
                        current = section.getAttribute('id');
                    }
                });

                if (current) {
                    document.querySelectorAll('nav a').forEach(a => {
                        a.classList.remove('sidebar-item-active');
                        // Reset text colors
                        if (a.classList.contains('text-white')) {
                            a.classList.remove('text-white');
                            a.classList.add('text-neutral-400');
                        }

                        if (a.getAttribute('href') === `#${current}`) {
                            a.classList.add('sidebar-item-active');
                            a.classList.remove('text-neutral-400');
                            a.classList.add('text-white');

                            const breadcrumb = document.getElementById('breadcrumb-current');
                            if (breadcrumb) breadcrumb.textContent = a.querySelector('span').textContent;
                        }
                    });
                }
            });
        }

        // Mobile Sidebar Logic
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const sidebarToggle = document.getElementById('sidebar-toggle');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>

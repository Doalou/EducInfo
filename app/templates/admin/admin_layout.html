<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin | EducInfo{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Admin Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        /* Palette harmonisée avec l'écran TV (tv-mode.css dark) */
                        neutral: {
                            50: '#eef3f0', 100: '#dfe6e2', 200: '#c4d0ca', 300: '#9babb1',
                            400: '#7a8a92', 500: '#56646c', 600: '#3d4a52', 700: '#2a3540',
                            800: '#1e2830', 900: '#12191f', 950: '#10171d'
                        },
                        obsidian: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
                            400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
                            800: '#1e293b', 900: '#0f172a', 950: '#020617'
                        },
                        sage: {
                            50: '#f7fee7', 100: '#ecfccb', 200: '#d9f99d', 300: '#bef264',
                            400: '#a3e635', 500: '#84cc16', 600: '#65a30d', 700: '#4d7c0f',
                            800: '#3f6212', 900: '#365314', 950: '#1a2e05'
                        },
                        plum: {
                            50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe',
                            400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7e22ce',
                            800: '#6b21a8', 900: '#581c87', 950: '#3b0764'
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        /* sidebar-item-active conservé pour compatibilité JS existant */
        .sidebar-item-active { background: #1e2830; color: #fff; border-right: 3px solid #f0c971; }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-neutral-950 text-neutral-200 font-sans selection:bg-amber-500/30">
    <div class="flex min-h-screen overflow-hidden">
        <!-- Sidebar -->
        <div id="sidebar-overlay"
            class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden cursor-pointer"></div>

        {% include 'admin/partials/_sidebar.html' %}

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">

            {% include 'admin/partials/_header.html' %}

            <!-- Scrollable Area -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-10 relative scroll-smooth space-y-8" id="main-scroll-area">
                {% include 'includes/flash_messages.html' %}
                {% block content %}{% endblock %}

                <!-- Footer Spacer -->
                <div class="h-20"></div>
            </div>
        </main>
    </div>

    <!-- Modals Holder -->
    <div id="modal-container"></div>

    <script>
        // Simple smoothing for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);

                if (targetElement) {
                    document.querySelectorAll('nav a').forEach(a => {
                        a.classList.remove('sidebar-item-active');
                        a.classList.remove('text-white');
                        a.classList.add('text-neutral-400');
                    });

                    this.classList.add('sidebar-item-active');
                    this.classList.remove('text-neutral-400');

                    const breadcrumb = document.getElementById('breadcrumb-current');
                    if (breadcrumb) {
                        breadcrumb.textContent = this.querySelector('span').textContent;
                    }

                    targetElement.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Current section detection on scroll
        const scrollArea = document.getElementById('main-scroll-area');
        const sections = document.querySelectorAll('section[id]');

        if (scrollArea) {
            scrollArea.addEventListener('scroll', () => {
                let current = "";
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (scrollArea.scrollTop >= (sectionTop - 200)) {
                        current = section.getAttribute('id');
                    }
                });

                if (current) {
                    document.querySelectorAll('nav a').forEach(a => {
                        a.classList.remove('sidebar-item-active');
                        if (a.classList.contains('text-white')) {
                            a.classList.remove('text-white');
                            a.classList.add('text-neutral-400');
                        }

                        if (a.getAttribute('href') === `#${current}`) {
                            a.classList.add('sidebar-item-active');
                            a.classList.remove('text-neutral-400');
                            a.classList.add('text-white');

                            const breadcrumb = document.getElementById('breadcrumb-current');
                            if (breadcrumb) breadcrumb.textContent = a.querySelector('span').textContent;
                        }
                    });
                }
            });
        }

        // Mobile Sidebar Logic
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const sidebarToggle = document.getElementById('sidebar-toggle');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>

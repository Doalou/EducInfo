<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé -->
  <rect width="200" height="200" rx="32" fill="url(#paint0_linear)" />
  
  <!-- Effet d'ombre douce -->
  <rect x="12" y="12" width="176" height="176" rx="24" fill="url(#paint1_radial)" fill-opacity="0.2" />
  
  <!-- Nouveau E stylisé (remplace les anciens éléments graphiques) -->
  <g fill="white">
    <rect x="70" y="72.5" width="60" height="15" rx="3"/>
    <rect x="70" y="92.5" width="50" height="15" rx="3"/>
    <rect x="70" y="112.5" width="60" height="15" rx="3"/>
  </g>
  
  <!-- Filtres et dégradés -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1" />
      <stop offset="1" stop-color="#4338CA" />
    </linearGradient>
    <radialGradient id="paint1_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) rotate(90) scale(100)">
      <stop offset="0" stop-color="white" stop-opacity="0.2" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg> 
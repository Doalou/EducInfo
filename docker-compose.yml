services:
  educinfo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: educinfo-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CTS_API_TOKEN=${CTS_API_TOKEN:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_CITY=${WEATHER_CITY:-Strasbourg}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - educinfo-network

networks:
  educinfo-network:
    driver: bridge

volumes:
  educinfo-data:
    driver: local 
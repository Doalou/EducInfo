name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m piptools compile pyproject.toml --output-file=requirements.lock --strip-extras --quiet
      - run: git diff --exit-code requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pip-audit --requirement requirements.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: educinfo:test
      - name: Smoke test
        run: |
          docker run -d --name educinfo -e APP_ENV=production -e SECRET_KEY=test-only-secret -e ADMIN_PASSWORD=test-password-long educinfo:test
          for i in {1..20}; do docker exec educinfo curl -fsS http://localhost:5000/health/ready && exit 0; sleep 1; done
          docker logs educinfo
          exit 1

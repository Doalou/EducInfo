name: EducInfo

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - '*'
#  schedule:
#    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  EducInfo:
    name: EducInfo:${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["docker"]
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v6
        with:
#          submodules: 'recursive'
          fetch-depth: 1
#      - name: Install dependencies
#        run: sudo apt-get update && sudo apt-get install 
      - name: Build
        run: CPUS=2.0 MEMORY=8GB make ${{ matrix.image }}
      - name: Update the image
        run: CPUS=2.0 MEMORY=8GB make ${{ matrix.image }}.update
      - name: Test the image
        run: CPUS=2.0 MEMORY=8GB make ${{ matrix.image }}.test
      - name: Build Docker image with custom tag
        run: |
          TIMESTAMP=$(date +%s)
          docker build . --file docker/Dockerfile --tag "educinfo:${TIMESTAMP}" --tag "educinfo:latest"
          echo "Image construite : educinfo:${TIMESTAMP}"
      - name: clean the image
        run: CPUS=2.0 MEMORY=8GB make ${{ matrix.image }}.clean
      - name: purge the image
        run: CPUS=2.0 MEMORY=8GB make ${{ matrix.image }}.purge
#      - name: "Push to hub.docker.com"
#        if: github.ref == 'refs/heads/main'
#        run: |
#            echo ${{ secrets.DOCKER_PASS }} | docker login --username ${{ secrets.DOCKER_USER }} --password-stdin
#            make ${{ matrix.image }}.push

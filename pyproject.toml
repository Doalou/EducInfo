[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educinfo"
version = "3.0.0"
description = "Écran d'information scolaire administrable"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "Doalo", email = "contact@doalo.fr"}]
dependencies = [
  "Flask==3.1.3",
  "Flask-Login>=0.6.3,<1",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1.1,<4",
  "Flask-WTF>=1.2.2,<2",
  "SQLAlchemy>=2.0.45,<2.1",
  "WTForms>=3.2.1,<4",
  "email-validator>=2.3,<3",
  "gunicorn>=23,<24",
  "python-dateutil>=2.9,<3",
  "requests>=2.32.5,<3",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9",
  "pip-tools>=7.5,<8",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-flask>=1.3",
  "pytest-mock>=3.15",
  "ruff>=0.14",
]

[project.scripts]
educinfo = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=app", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

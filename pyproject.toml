[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educinfo"
version = "1.3.0"
description = "Plateforme d'information scolaire avec Flask"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "EducInfo Team", email = "contact@educinfo.example"}
]
keywords = ["flask", "education", "school", "information"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "Flask>=3.1.2,<4.0",
    "Werkzeug>=3.1.4,<4.0",
    "Flask-SQLAlchemy>=3.1.1,<4.0",
    "SQLAlchemy>=2.0.45,<2.1",
    "python-dotenv>=1.2.1,<2.0",
    "requests>=2.32.5,<3.0",
    "Flask-Login>=0.6.3,<1.0",
    "Flask-WTF>=1.2.2,<2.0",
    "WTForms>=3.2.1,<4.0",
    "pytz>=2024.1",
    "Flask-Migrate>=4.0.7,<5.0",
    "gunicorn>=23.0.0,<24.0",
    "cryptography>=46.0.3",
    "email-validator>=2.1.1",
    "itsdangerous>=2.2.0",
    "flask-caching>=2.3.0,<3.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
monitoring = ["prometheus-client>=0.20.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-flask>=1.3.0",
]
all = ["educinfo[redis,monitoring,dev]"]

[project.urls]
Homepage = "https://github.com/yourusername/educinfo"
Documentation = "https://github.com/yourusername/educinfo/wiki"
Repository = "https://github.com/yourusername/educinfo.git"
"Bug Tracker" = "https://github.com/yourusername/educinfo/issues"

[project.scripts]
educinfo = "run:main"

# Configuration pour pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Configuration pour coverage
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Configuration pour setuptools
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"] 
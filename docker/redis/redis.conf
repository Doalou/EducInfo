# Configuration Redis pour EducInfo Cluster
# Optimisée pour le cache partagé entre instances

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16
always-show-logo yes

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence optimisée pour cache
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF disabled pour performance (cache usage)
appendonly no

# Security
requirepass educinfo_redis_2023
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# Performance tuning
timeout 0
tcp-keepalive 300
hz 10

# Client settings
maxclients 10000

# Memory usage optimization for cache
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Network optimizations
tcp-keepalive 300
timeout 0

# Enable keyspace notifications for expire events (utile pour le monitoring)
notify-keyspace-events "Ex"

# Disable potentially dangerous commands in production
rename-command SHUTDOWN SHUTDOWN_EDUCINFO_REDIS_2023 